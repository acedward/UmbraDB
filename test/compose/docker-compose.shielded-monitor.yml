# The shielded monitor as a SPLIT deployment: 2 MONITOR-NODES + 1 balancer + 1 storage API, over
# the one database `docker-compose.yml` already provides (00009-09, owner decisions Q25 and Q28).
#
# ── What changed from 00009-08 ───────────────────────────────────────────────────────────────
# The `scanner` and `api` services are gone. A monitor-node is one process that serves the API and
# the dashboard, scans every new block once for every key it holds, and is the ONLY place a viewing
# key exists — in RAM, never on disk and never in the database. Two of them, because "two of
# everything" is what this file has always been for; the balancer routes each registration to the
# node that holds that key.
#
# ── How to run it ────────────────────────────────────────────────────────────────────────────
#   docker compose -p umbradb-<yours> \
#     -f test/compose/docker-compose.yml \
#     -f test/compose/docker-compose.shielded-monitor.yml \
#     up -d node postgres archive-sync storage-api \
#        shielded-monitor-node-1 shielded-monitor-node-2 shielded-monitor-balancer
#
# Use a UNIQUE project name (this is a shared machine) and tear down with
# `down -v --remove-orphans`. `npm run demo:shielded-monitor -- --split` does all of that for you
# and prints the dashboard URL.
#
# ── No host ports, except the balancer's, and that one is opt-in ─────────────────────────────
# The base file publishes nothing, for the reasons its own header gives. This overlay follows it:
# the only host-facing service is the balancer, and it binds `127.0.0.1:${BALANCER_HOST_PORT}`
# with no default worth colliding on — set it, or use the demo script, which randomises a port
# above 10000.
#
# ── The one thing to read this file for ──────────────────────────────────────────────────────
# Which services carry `ARCHIVE_PG`/`MONITOR_PG`. There is exactly one: `storage-api`. Every
# project-B service has `STORAGE_URL` and nothing else, and each of them REFUSES to start if a
# `*_PG` variable appears in its environment (`shielded-monitor/no-database.ts`). That refusal is
# what makes this file's separation real rather than a convention nobody checks.
#
# `x-` anchors keep the two monitor-nodes literally identical apart from their node id, because
# "two of everything" is only meaningful if the two are the same thing.

x-monitor-image: &monitor-image
  build:
    context: ../..
    dockerfile: Dockerfile.shielded-monitor
  image: 'umbradb-shielded-monitor:${MONITOR_IMAGE_TAG:-local}'
  restart: unless-stopped

x-b-environment: &b-environment
  # Project B's ENTIRE configuration surface. No connection string, no schema, no credential.
  STORAGE_URL: 'http://storage-api:8788'
  NET: 'undeployed'
  SHIELDED_MONITOR_NET: 'undeployed'

# ── The ONE exception, opt-in and read-only (project 00016) ─────────────────────────────────
#
# The DUST wallet-sync module opens a second connection to the ARCHIVE database, by an explicit
# owner waiver (spec/00016-dust-wallet-sync.md §1). Unset -- the default here -- the module is off
# and every /v1/dust/* route answers 503 DUST_DISABLED; nothing else about the node changes.
#
# To turn it on, create the reader role (docs/shielded-monitor-deployment.md carries the SQL) and
# export DUST_DATABASE_URL before `up`. Note what the role must NOT be: the `umbra` superuser this
# test stack uses for `ARCHIVE_PG`. Pointing this at a writer would make the waiver unbounded, and
# the node would then hold a credential that can write to the archive -- the exact thing the split
# topology exists to prevent.
#
# It is deliberately NOT named `*_PG`: every project-B process still refuses to start if any such
# variable is in its environment, waiver or no waiver.
x-dust-environment: &dust-environment
  DUST_DATABASE_URL: '${DUST_DATABASE_URL:-}'
  DUST_STATE_SNAPSHOT_DIR: '/var/lib/umbradb/dust-state'
  DUST_STATE_POLL_MS: '${DUST_STATE_POLL_MS:-2000}'
  DUST_STATE_SNAPSHOT_EVERY: '${DUST_STATE_SNAPSHOT_EVERY:-20000}'
  DUST_REPLAY_BATCH: '${DUST_REPLAY_BATCH:-1000}'

services:
  # ── Project A ─────────────────────────────────────────────────────────────────────────────
  archive-sync:
    <<: *monitor-image
    command: ['archive-sync']
    depends_on:
      node:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ARCHIVE_PG: 'postgres://umbra:umbra@postgres:5432/umbra'
      NET: 'undeployed'
      NODE_URL: 'http://node:9944'
      NODE_ONLY: '1'

  storage-api:
    <<: *monitor-image
    command: ['storage']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The ONE credential in this stack.
      ARCHIVE_PG: 'postgres://umbra:umbra@postgres:5432/umbra'
      NET: 'undeployed'
      STORAGE_HOST: '0.0.0.0'
      STORAGE_PORT: '8788'
      # Applies project B's migration lineage at boot. Opt-in everywhere else; on a disposable
      # test stack it is what makes `up -d` sufficient.
      STORAGE_BOOTSTRAP: '1'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8788/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Project B: two monitor-nodes ──────────────────────────────────────────────────────────
  #
  # One process each: the public API, the dashboard at /ui, `/internal/*` for the balancer, and
  # both scan queues. The viewing keys they are sent live in these containers' RAM and nowhere
  # else — no volume holds a key, deliberately, because there is nothing about a key to persist.
  #
  # The one volume each node does get holds the DUST mirror's snapshot, and only when the module is
  # enabled. That file is PUBLIC CHAIN DATA — the two DUST Merkle trees as the chain committed them
  # — plus a header naming the net, the ledger build and the event id it stopped at. It exists so a
  # restart replays the last few thousand events instead of the whole chain; deleting it costs time
  # and nothing else. A node that finds a snapshot from another net or another ledger build refuses
  # it and replays from zero.
  shielded-monitor-node-1:
    <<: *monitor-image
    command: ['node']
    depends_on:
      storage-api:
        condition: service_healthy
    environment:
      # Two anchors, one merge key: YAML allows `<<` once per mapping, and a second one is a
      # parse error rather than a second merge.
      <<: [*b-environment, *dust-environment]
      MONITOR_NODE_ID: 'node-1'
      API_HOST: '0.0.0.0'
      API_PORT: '8787'
      SCAN_BATCH_BLOCKS: '8'
      SCAN_POLL_MS: '2000'
    volumes:
      - dust-state-node-1:/var/lib/umbradb/dust-state
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  shielded-monitor-node-2:
    <<: *monitor-image
    command: ['node']
    depends_on:
      storage-api:
        condition: service_healthy
    environment:
      # Two anchors, one merge key: YAML allows `<<` once per mapping, and a second one is a
      # parse error rather than a second merge.
      <<: [*b-environment, *dust-environment]
      MONITOR_NODE_ID: 'node-2'
      API_HOST: '0.0.0.0'
      API_PORT: '8787'
      SCAN_BATCH_BLOCKS: '8'
      SCAN_POLL_MS: '2000'
    volumes:
      - dust-state-node-2:/var/lib/umbradb/dust-state
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Project B: the balancer, the only host-facing service ─────────────────────────────────
  shielded-monitor-balancer:
    <<: *monitor-image
    command: ['balancer']
    depends_on:
      shielded-monitor-node-1:
        condition: service_healthy
      shielded-monitor-node-2:
        condition: service_healthy
    environment:
      <<: *b-environment
      BALANCER_UPSTREAMS: 'http://shielded-monitor-node-1:8787,http://shielded-monitor-node-2:8787'
      BALANCER_HOST: '0.0.0.0'
      BALANCER_PORT: '8789'
      BALANCER_PROBE_MS: '5000'
    ports:
      # Loopback only, and the port is required rather than defaulted: a default would be a fixed
      # number two parallel stacks on this machine would fight over.
      - '127.0.0.1:${BALANCER_HOST_PORT}:8789'

# Per-node, never shared: two nodes at different mirror tips are normal (every DUST response
# carries `atHeight`/`atEventId` so a client can tell), and one snapshot file written by two
# processes would not be.
volumes:
  dust-state-node-1:
  dust-state-node-2:
