name: Vendored ledger integrity

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vendored-ledger-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# `vendor/ledger-v8-syshash` is a committed binary build of the Midnight ledger WASM, carrying five
# exports the published package lacks: `SystemTransaction.transactionHash()`, without which
# node-only ingest cannot archive system transactions at all; `SystemTransaction.cost()`, without
# which it cannot cost them, and so records genesis -- which is nothing but system transactions --
# as having zero fullness; and `LedgerParameters.clampAndNormalizeFullness()`, without which an
# overfull block throws where the node reports it as full; and `LedgerState.closeBlock()`, which
# keeps exact Q64 block-close math inside Rust; and `LedgerState.ledgerStateRoot()`, which emits the
# node-comparable committed ledger root. Its correctness is load-bearing for the archive.
#
# This gate deliberately does NOT rebuild and compare bytes. The build is not bit-reproducible:
# the same commit, `wasm-pack 0.15.0` and `rustc 1.93.0` produce a different `.wasm` hash on each
# run (measured 2026-08-08). A byte comparison against a rebuild would fail every time while saying
# nothing about correctness.
#
# What it checks instead is what actually matters, in two layers: that the committed bytes are the
# ones that were reviewed, and that they still behave like the reference implementation.
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 24

      # Layer 1: the committed bytes are unmodified since review. Catches a corrupted or
      # tampered-with artifact, which a diff on a 19 MB binary would not make obvious.
      - name: Verify vendored checksums
        working-directory: vendor/ledger-v8-syshash
        run: sha256sum -c SHA256SUMS

      - name: Install dependencies
        run: npm ci

      # The vendored package must be what actually resolves. If a future change reintroduces a
      # published version, system transactions would stop being archivable with no other signal
      # than distant test failures.
      # Read the manifest through the filesystem, not `require(...)`: the package's `exports` map
      # intentionally exposes only the module entries, so requesting './package.json' through the
      # specifier fails with ERR_PACKAGE_PATH_NOT_EXPORTED.
      - name: Verify the vendored build is what resolves
        run: |
          set -euo pipefail
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('node_modules/@midnight-ntwrk/ledger-v8/package.json','utf8')).version)")"
          echo "resolved ledger version: $version"
          test "$version" = "8.1.0-syshash.4"

      # Layer 2, the meaningful one: behavioural equivalence with an INDEPENDENT implementation.
      # The five system transactions of a 1.0.0 devnet genesis block, as archived by
      # midnight-indexer 4.3.2, must have their hashes reproduced from the indexer's own recorded
      # bytes. Comparing against the indexer rather than against our own output is what makes this
      # evidence rather than a tautology.
      - name: Verify the export against the indexer's ground truth
        run: npx vitest run test/chain-archive-sync/vendored-ledger-vectors.test.ts --maxWorkers=1

      # The expected state hash was generated by a native-Rust fold in the source fork. Running the
      # replay test against this installed vendored package proves the committed bytes retain exact
      # Q64 close semantics; the fixture also pins the old rounded result as a counterweight.
      - name: Verify atomic close against the native-Rust oracle
        run: >-
          npx vitest run test/chain-archive-sync/ledger-replay.test.ts --maxWorkers=1
          -t "matches the committed native-Rust close oracle"

      # These exports are the entire reason this artifact is vendored; assert each exists explicitly
      # so a build silently missing one fails here, naming it, rather than in ingest. Checked
      # individually rather than as a conjunction so the failure says WHICH one is absent -- they
      # were added by different builds: `…syshash.1` has only the first, while `…syshash.2`
      # still lacks the atomic close export.
      - name: Verify the vendored exports are present
        run: |
          set -euo pipefail
          node --input-type=module -e "
            const m = await import('@midnight-ntwrk/ledger-v8');
            const checks = {
              'SystemTransaction.transactionHash': typeof m.SystemTransaction?.prototype?.transactionHash === 'function',
              'SystemTransaction.cost': typeof m.SystemTransaction?.prototype?.cost === 'function',
              'LedgerParameters.clampAndNormalizeFullness': typeof m.LedgerParameters?.prototype?.clampAndNormalizeFullness === 'function',
              'LedgerState.closeBlock': typeof m.LedgerState?.prototype?.closeBlock === 'function',
              'LedgerState.ledgerStateRoot': typeof m.LedgerState?.prototype?.ledgerStateRoot === 'function',
            };
            let ok = true;
            for (const [name, present] of Object.entries(checks)) {
              console.log((present ? 'present: ' : 'MISSING: ') + name);
              if (!present) ok = false;
            }
            process.exit(ok ? 0 : 1);
          "
